[workspace]
resolver = "2"
members = ["crates/switchyard-core", "crates/switchyard-render", "crates/switchyard-kindle", "crates/switchyard-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
switchyard-core = { path = "crates/switchyard-core" }
switchyard-render = { path = "crates/switchyard-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
